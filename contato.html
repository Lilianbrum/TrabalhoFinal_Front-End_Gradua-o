  <header class="topo">
    <h1>Contato</h1>

  </header>


  <main class="contato-container">

    <section class="contato-info">
      <h2>Vamos conversar?</h2>
      <p>Use o formulário ao lado para enviar críticas, sugestões de novas obras ou partilhar uma reflexão sobre a
        curadoria.</p>
    </section>

    <form id="formContato">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome...">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com">

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="5" placeholder="Sua mensagem..."></textarea>

      <button type="submit">Enviar Mensagem</button>
    </form>

  </main>
